name: "OpenProjectX: Build and publish image"

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openprojectx/kafka-ui

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          if [ -z "$version" ]; then
            echo "Unable to resolve Gradle artifact version from gradle.properties" >&2
            exit 1
          fi

          echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build jar
        run: |
          ./gradlew clean build \
            -x test \
            -x check \
            -Pinclude-frontend=true \
            -Pversion=${{ steps.meta.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          sbom: true
          build-args: |
            JAR_FILE=build/libs/api-${{ steps.meta.outputs.version }}.jar
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha8 }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
