---
services:

  kafbat-ui-consumer-only:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 7081:8080
    depends_on:
      kafka-init-acls-consumer-only:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: consumer-only
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-consumer-only:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka-ui-consumer" password="consumer-secret";'
      DYNAMIC_CONFIG_ENABLED: "false"

  kafka-init-acls-consumer-only:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      - kafka-consumer-only
    command:
      - /bin/bash
      - -ec
      - |
        printf '%s\n' \
          'security.protocol=SASL_PLAINTEXT' \
          'sasl.mechanism=PLAIN' \
          'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";' \
          > /tmp/admin.properties

        for i in {1..60}; do
          kafka-topics --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --list >/dev/null && break
          sleep 2
        done

        kafka-topics --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --create --topic consumer.messages --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --create --topic consumer.audit --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --create --topic consumer.payments --partitions 2 --replication-factor 1 --if-not-exists

        kafka-acls --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --add --allow-principal User:kafka-ui-consumer --operation Read --operation Describe --topic '*'
        kafka-acls --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --add --allow-principal User:kafka-ui-consumer --operation Read --group '*'

        kafka-acls --bootstrap-server kafka-consumer-only:29092 --command-config /tmp/admin.properties --list --principal User:kafka-ui-consumer

  kafka-consumer-only:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka-consumer-only
    command:
      - /bin/bash
      - -ec
      - |
        printf '%s\n' \
          'KafkaServer {' \
          '  org.apache.kafka.common.security.plain.PlainLoginModule required' \
          '  username="admin"' \
          '  password="admin-secret"' \
          '  user_admin="admin-secret"' \
          '  user_kafka-ui-consumer="consumer-secret";' \
          '};' \
          > /tmp/kafka_server.conf
        exec /etc/confluent/docker/run
    ports:
      - "19092:19092"
      - "19997:9997"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-consumer-only:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_PLAINTEXT_HOST:SASL_PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'SASL_PLAINTEXT://kafka-consumer-only:29092,SASL_PLAINTEXT_HOST://localhost:19092'
      KAFKA_LISTENERS: 'SASL_PLAINTEXT://0.0.0.0:29092,SASL_PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'SASL_PLAINTEXT'
      KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: 'PLAIN'
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server.conf"
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_kafka-ui-consumer="consumer-secret";'
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_HOST_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_kafka-ui-consumer="consumer-secret";'
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: 'User:admin;User:ANONYMOUS'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'L6d9Y1BmT22QYchN2xFcJQ'
