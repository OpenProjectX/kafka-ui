services:
  kerby-kdc:
    image: openprojectx/kerby-kdc:latest
    container_name: kerby-kdc
    ports:
      - "88:88/tcp"
      - "88:88/udp"
    environment:
      KERBY_REALM: EXAMPLE.COM
      KERBY_KDC_HOST: kerby-kdc
      KERBY_KDC_BIND_HOST: 0.0.0.0
      KERBY_KDC_TCP_PORT: "88"
      KERBY_KDC_UDP_PORT: "88"
      KERBY_CLIENT_KDC_HOST: kerby-kdc
      KERBY_CLIENT_KDC_PORT: "88"
      KERBY_CLIENT_DOMAIN: example.com
      KERBY_PREAUTH_REQUIRED: "false"
      KERBY_PA_ENC_TIMESTAMP_REQUIRED: "false"
      KERBY_CLIENT_PRINCIPAL: app_user@EXAMPLE.COM
      KERBY_CLIENT_PASSWORD: app-user-secret
      KERBY_SERVICE_PRINCIPAL: HTTP/api.example.com@EXAMPLE.COM
      KERBY_SERVICE_KEYTAB: /var/lib/kerby/keytabs/http-api.keytab
      KERBY_EXTRA_SERVICE_PRINCIPALS: >-
        kafka/broker1.example.com@EXAMPLE.COM:/var/lib/kerby/keytabs/kafka-broker1.keytab,
        kafka/broker2.example.com@EXAMPLE.COM:/var/lib/kerby/keytabs/kafka-broker2.keytab,
        kafbat-ui/kafbat-ui.example.com@EXAMPLE.COM:/var/lib/kerby/keytabs/kafbat-ui.keytab,
        mm2/mm2.example.com@EXAMPLE.COM:/var/lib/kerby/keytabs/mm2.keytab,
        schema-registry/schema-registry.example.com@EXAMPLE.COM:/var/lib/kerby/keytabs/schema-registry.keytab
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/lib/kerby/client/krb5.conf && test -f /var/lib/kerby/keytabs/kafka-broker1.keytab && test -f /var/lib/kerby/keytabs/kafka-broker2.keytab && test -f /var/lib/kerby/keytabs/kafbat-ui.keytab && test -f /var/lib/kerby/keytabs/mm2.keytab && test -f /var/lib/kerby/keytabs/schema-registry.keytab
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./kerberos/generated:/var/lib/kerby
      - ./kerberos/log4j.properties:/opt/kerby/log4j.properties:ro

  kafka:
    image: apache/kafka:3.9.0
    hostname: broker1.example.com
    container_name: kafka-kerberos
    depends_on:
      kerby-kdc:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9997:9997"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://broker1.example.com:9092
      KAFKA_LISTENERS: SASL_PLAINTEXT://broker1.example.com:9092,CONTROLLER://broker1.example.com:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf -Djava.security.auth.login.config=/etc/kafka/kerberos/kafka_server_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1.example.com:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_SUPER_USERS: "User:kafka/broker1.example.com@EXAMPLE.COM;User:kafbat-ui/kafbat-ui.example.com@EXAMPLE.COM;User:mm2/mm2.example.com@EXAMPLE.COM;User:schema-registry/schema-registry.example.com@EXAMPLE.COM"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./kerberos/generated:/kerby:ro
      - ./kerberos/kafka_server_jaas.conf:/etc/kafka/kerberos/kafka_server_jaas.conf:ro
    networks:
      default:
        aliases:
          - broker1.example.com

  kafka-standby:
    image: apache/kafka:3.9.0
    hostname: broker2.example.com
    container_name: kafka-kerberos-standby
    depends_on:
      kerby-kdc:
        condition: service_healthy
    ports:
      - "9093:9093"
      - "9998:9998"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://broker2.example.com:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://broker2.example.com:9093,CONTROLLER://broker2.example.com:39093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf -Djava.security.auth.login.config=/etc/kafka/kerberos/kafka_server_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9998
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@broker2.example.com:39093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_SUPER_USERS: "User:kafka/broker2.example.com@EXAMPLE.COM;User:kafbat-ui/kafbat-ui.example.com@EXAMPLE.COM;User:mm2/mm2.example.com@EXAMPLE.COM"
      CLUSTER_ID: zlFiTJelTOuhnklFwLWixw
    volumes:
      - ./kerberos/generated:/kerby:ro
      - ./kerberos/kafka_standby_server_jaas.conf:/etc/kafka/kerberos/kafka_server_jaas.conf:ro
    networks:
      default:
        aliases:
          - broker2.example.com

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry.example.com
    container_name: schema-registry-kerberos
    depends_on:
      - kafka
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry.example.com
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://broker1.example.com:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: GSSAPI
      SCHEMA_REGISTRY_KAFKASTORE_SASL_KERBEROS_SERVICE_NAME: kafka
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/kerby/keytabs/schema-registry.keytab" principal="schema-registry/schema-registry.example.com@EXAMPLE.COM";
      KAFKA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf
      KRB5_CONFIG: /kerby/client/krb5.conf
      SCHEMA_REGISTRY_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: http
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - ./kerberos/generated:/kerby:ro
    networks:
      default:
        aliases:
          - schema-registry.example.com

  kafbat-ui:
    container_name: kafbat-ui-kerberos
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - kafka
      - kafka-standby
      - schema-registry
    ports:
      - "7080:8080"
    environment:
      JAVA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf
      KAFKA_CLUSTERS_0_NAME: kerberos-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1.example.com:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry.example.com:8085
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: GSSAPI
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/kerby/keytabs/kafbat-ui.keytab" principal="kafbat-ui/kafbat-ui.example.com@EXAMPLE.COM";
      KAFKA_CLUSTERS_1_NAME: kerberos-standby
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: broker2.example.com:9093
      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_MECHANISM: GSSAPI
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_JAAS_CONFIG: com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/kerby/keytabs/kafbat-ui.keytab" principal="kafbat-ui/kafbat-ui.example.com@EXAMPLE.COM";
      DYNAMIC_CONFIG_ENABLED: "false"
    volumes:
      - ./kerberos/generated:/kerby:ro

  kafka-init-topics:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
      - kafka-standby
    environment:
      KAFKA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf
    command:
      - /bin/bash
      - -ec
      - |
        for i in {1..60}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1.example.com:9092 --command-config /etc/kafka/kerberos/client.properties --list >/dev/null && break
          sleep 2
        done
        for i in {1..60}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker2.example.com:9093 --command-config /etc/kafka/kerberos/standby-client.properties --list >/dev/null && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1.example.com:9092 --command-config /etc/kafka/kerberos/client.properties --create --topic kerberos.messages --partitions 1 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1.example.com:9092 --command-config /etc/kafka/kerberos/client.properties --create --topic primary.orders --partitions 2 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1.example.com:9092 --command-config /etc/kafka/kerberos/client.properties --create --topic primary.payments --partitions 2 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1.example.com:9092 --command-config /etc/kafka/kerberos/client.properties --create --topic primary.audit --partitions 1 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker2.example.com:9093 --command-config /etc/kafka/kerberos/standby-client.properties --create --topic standby.local-events --partitions 1 --replication-factor 1 --if-not-exists
    volumes:
      - ./kerberos/generated:/kerby:ro
      - ./kerberos/client.properties:/etc/kafka/kerberos/client.properties:ro
      - ./kerberos/standby-client.properties:/etc/kafka/kerberos/standby-client.properties:ro

  mirror-maker:
    image: apache/kafka:3.9.0
    container_name: kafka-kerberos-mm2
    depends_on:
      kafka:
        condition: service_started
      kafka-standby:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_OPTS: -Djava.security.krb5.conf=/kerby/client/krb5.conf
    command:
      - /bin/bash
      - -ec
      - /opt/kafka/bin/connect-mirror-maker.sh /etc/kafka/kerberos/mm2.properties
    volumes:
      - ./kerberos/generated:/kerby:ro
      - ./kerberos/mm2.properties:/etc/kafka/kerberos/mm2.properties:ro
